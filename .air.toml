root = "."
tmp_dir = "tmp"

[build]
cmd = "CGO_ENABLED=0 go build -buildvcs=false -o ./tmp/server ./cmd/api"
bin = "./tmp/server"
include_ext = ["go", "mod", "sum"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["tmp", "storage", "vendor", ".git"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
poll = true
poll_interval = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = true
