# Project yang sama untuk kedua mode: satu service DB dan volume yang sama.
# Pertahankan nama ini agar data pada absensi-dev_pgdata tetap digunakan.
name: absensi-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    # STORAGE_DRIVER dan S3_* (R2) dibaca dari .env; volume dipertahankan untuk migrasi/restore local.
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
      APP_PORT: 8080
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      STORAGE_DIR: /app/storage
      # Root MinIO hanya untuk initializer/Console, bukan environment API.
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      TZ: ${APP_TIMEZONE}
    ports:
      - "127.0.0.1:${HTTP_PORT}:8080"
    volumes:
      - .:/app
      - storage:/app/storage
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - air-tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/v1/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  minio:
    image: ${MINIO_IMAGE}
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      target: server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  minio-init:
    image: ${MINIO_MC_IMAGE}
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      target: client
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PREFIX: ${MINIO_PREFIX}
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${APP_TIMEZONE}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # Tool migration dijalankan terpisah, mengikuti coffee-api.
  # docker compose -f docker-compose.dev.yml run --rm migrate
  migrate:
    image: migrate/migrate:v4.19.1

    volumes:
      - ./migrations:/migrations:ro

    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - up

    depends_on:
      db:
        condition: service_healthy

    profiles:
      - tools
volumes:
  pgdata:
  storage:
  go-mod:
  go-build:
  air-tmp:
  minio-data:
